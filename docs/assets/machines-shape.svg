<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title description">
  <title id="title">How the client reaches every machine</title>
  <desc id="description">On your machine, the terminal UI holds one connection per machine. It reaches the local server directly on its client socket. For each saved host it runs ssh, sharing one ControlMaster connection per host, and starts fpk bridge on the host; the bridge relays its standard input and output to that host's client socket, where the host's own server answers. Every host runs its own server, and no server talks to another: the client aggregates them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <!-- Machines. -->
  <rect class="group" x="20" y="30" width="440" height="470" rx="14"/>
  <text class="group-label" x="240" y="58">YOUR MACHINE</text>
  <text class="secondary" x="240" y="78">~/.file-peeker/</text>

  <rect class="group" x="590" y="30" width="470" height="220" rx="14"/>
  <text class="group-label" x="825" y="58">HOST · workbox</text>
  <text class="secondary" x="825" y="78">its own ~/.file-peeker/</text>

  <rect class="group" x="590" y="280" width="470" height="220" rx="14"/>
  <text class="group-label" x="825" y="308">HOST · nano4</text>
  <text class="secondary" x="825" y="328">its own ~/.file-peeker/</text>

  <!-- Edges. -->
  <path class="edge" d="M 140 190 V 368"/>
  <text class="edge-label start-label" x="150" y="270">client socket</text>
  <text class="edge-label start-label" x="150" y="288">directly</text>

  <path class="edge" d="M 340 190 V 258"/>
  <text class="edge-label start-label" x="350" y="222">one per machine</text>

  <path class="edge wire" d="M 430 290 H 475 V 150 H 618"/>
  <path class="edge wire" d="M 430 320 H 475 V 400 H 618"/>
  <text class="edge-label" x="532" y="262">ssh &lt;target&gt;</text>
  <text class="edge-label" x="532" y="278">fpk bridge</text>
  <text class="edge-label" x="532" y="302">over stdin,</text>
  <text class="edge-label" x="532" y="318">stdout</text>

  <path class="edge" d="M 790 150 H 838"/>
  <text class="edge-label" x="814" y="140">socket</text>
  <path class="edge" d="M 790 400 H 838"/>
  <text class="edge-label" x="814" y="390">socket</text>

  <!-- Stages. -->
  <rect class="client-node" x="50" y="110" width="380" height="80" rx="12"/>
  <text x="240" y="143">fpk</text>
  <text class="secondary" x="240" y="167">the terminal UI: one connection per machine</text>

  <rect class="server-node" x="50" y="370" width="180" height="90" rx="12"/>
  <text x="140" y="405">fpk server</text>
  <text class="secondary" x="140" y="430">local</text>

  <rect class="node" x="250" y="260" width="180" height="90" rx="12"/>
  <text x="340" y="295">ssh</text>
  <text class="secondary" x="340" y="319">one shared connection</text>
  <text class="secondary" x="340" y="337">per host</text>

  <rect class="client-node" x="620" y="110" width="170" height="80" rx="12"/>
  <text x="705" y="143">fpk bridge</text>
  <text class="secondary" x="705" y="167">relays stdio</text>

  <rect class="server-node" x="840" y="110" width="190" height="80" rx="12"/>
  <text x="935" y="143">fpk server</text>
  <text class="secondary" x="935" y="167">workbox's tasks</text>

  <rect class="client-node" x="620" y="360" width="170" height="80" rx="12"/>
  <text x="705" y="393">fpk bridge</text>
  <text class="secondary" x="705" y="417">relays stdio</text>

  <rect class="server-node" x="840" y="360" width="190" height="80" rx="12"/>
  <text x="935" y="393">fpk server</text>
  <text class="secondary" x="935" y="417">nano4's tasks</text>

  <!-- Servers never talk to one another. -->
  <text class="secondary" x="935" y="268">no link between servers</text>
</svg>
