<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="530" viewBox="0 0 1110 530" role="img" aria-labelledby="title description">
  <title id="title">Task pipeline</title>
  <desc id="description">Three processes. The CLI sends task.demo as JSON over the API socket to the server. In the server, server::api submits a Demo to task::Runtime, which admits, runs and settles it, its body running as a tokio task of its own; every change goes out as a TaskEvent to server::attach, which sends a snapshot and then each change as the task is now. That stream, Watch on the client protocol socket, reaches the terminal UI: tui::connection decodes it into task updates, tui::app applies them and drops settled tasks five seconds after they settle, and tui::view draws them in the sidebar's lower half. Numbers match the sections of the task pipeline document.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --group: #b4bdcc;
        --client-surface: #e4f6ec;
        --client-border: #27875b;
        --server-surface: #e5efff;
        --server-border: #3478c8;
        --badge: #172033;
        --badge-text: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --group: #5a667a;
          --client-surface: #173d30;
          --client-border: #5bc792;
          --server-surface: #193a62;
          --server-border: #72aef2;
          --badge: #eef3fb;
          --badge-text: #172033;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 13px; }
      .group-label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .edge-label { fill: var(--muted-text); font-size: 12px; }
      .start-label { text-anchor: start; }
      .group { fill: none; stroke: var(--group); stroke-width: 1.5; stroke-dasharray: 6 5; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .server-node { fill: var(--server-surface); stroke: var(--server-border); stroke-width: 2; }
      .runtime-node { fill: var(--surface-strong); stroke: var(--server-border); stroke-width: 2.5; }
      .client-node { fill: var(--client-surface); stroke: var(--client-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .wire { stroke: var(--server-border); }
      .arrow-head { fill: var(--border); }
      .badge { fill: var(--badge); }
      .badge-text { fill: var(--badge-text); font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <!-- Processes. -->
  <rect class="group" x="20" y="30" width="150" height="470" rx="14"/>
  <text class="group-label" x="95" y="58">CLI</text>
  <text class="secondary" x="95" y="78">fpk task demo</text>

  <rect class="group" x="295" y="30" width="345" height="470" rx="14"/>
  <text class="group-label" x="460" y="58">SERVER</text>
  <text class="secondary" x="460" y="78">fpk server</text>

  <rect class="group" x="780" y="30" width="300" height="470" rx="14"/>
  <text class="group-label" x="930" y="58">TERMINAL UI</text>
  <text class="secondary" x="930" y="78">fpk</text>

  <!-- Edges. -->
  <path class="edge" d="M 155 150 H 308"/>
  <text class="edge-label" x="232" y="138">file-peeker.sock</text>
  <text class="edge-label" x="232" y="170">task.demo · JSON</text>

  <path class="edge" d="M 460 190 V 243"/>
  <text class="edge-label start-label" x="472" y="222">submit</text>

  <path class="edge" d="M 460 355 V 398"/>
  <text class="edge-label start-label" x="472" y="382">TaskEvent</text>

  <path class="edge wire" d="M 610 435 H 710 V 150 H 803"/>
  <text class="edge-label" transform="translate(694 292) rotate(-90)">file-peeker-client.sock</text>
  <text class="edge-label" transform="translate(730 292) rotate(-90)">Watch: Hello, snapshot, changes</text>

  <path class="edge" d="M 930 190 V 243"/>
  <text class="edge-label start-label" x="942" y="222">TaskUpdate</text>

  <path class="edge" d="M 930 335 V 388"/>
  <text class="edge-label start-label" x="942" y="367">every 250 ms</text>

  <!-- Stages. -->
  <rect class="node" x="35" y="110" width="120" height="80" rx="12"/>
  <text x="95" y="145">cli</text>
  <text class="secondary" x="95" y="168">ApiClient</text>

  <rect class="server-node" x="310" y="110" width="300" height="80" rx="12"/>
  <text x="460" y="143">server::api</text>
  <text class="secondary" x="460" y="167">submit a Demo, answer its id</text>

  <rect class="runtime-node" x="310" y="245" width="300" height="110" rx="12"/>
  <text x="460" y="282">task::Runtime</text>
  <text class="secondary" x="460" y="307">admit → run → settle</text>
  <text class="secondary" x="460" y="329">the body runs as its own tokio task</text>

  <rect class="server-node" x="310" y="400" width="300" height="70" rx="12"/>
  <text x="460" y="429">server::attach</text>
  <text class="secondary" x="460" y="452">snapshot, then each change as it is now</text>

  <rect class="client-node" x="805" y="110" width="250" height="80" rx="12"/>
  <text x="930" y="143">tui::connection</text>
  <text class="secondary" x="930" y="167">client::watch decodes</text>

  <rect class="client-node" x="805" y="245" width="250" height="90" rx="12"/>
  <text x="930" y="280">tui::app</text>
  <text class="secondary" x="930" y="303">apply to the machine's list</text>
  <text class="secondary" x="930" y="323">drop 5 s after it settles</text>

  <rect class="client-node" x="805" y="390" width="250" height="80" rx="12"/>
  <text x="930" y="423">tui::view</text>
  <text class="secondary" x="930" y="447">the sidebar's lower half</text>

  <!-- Section numbers in the task pipeline document. -->
  <circle class="badge" cx="310" cy="110" r="12"/><text class="badge-text" x="310" y="114">1</text>
  <circle class="badge" cx="310" cy="245" r="12"/><text class="badge-text" x="310" y="249">2</text>
  <circle class="badge" cx="310" cy="400" r="12"/><text class="badge-text" x="310" y="404">3</text>
  <circle class="badge" cx="710" cy="435" r="12"/><text class="badge-text" x="710" y="439">4</text>
  <circle class="badge" cx="805" cy="110" r="12"/><text class="badge-text" x="805" y="114">5</text>
  <circle class="badge" cx="805" cy="390" r="12"/><text class="badge-text" x="805" y="394">6</text>
</svg>
