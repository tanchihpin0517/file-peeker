<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1250" viewBox="0 0 900 1250" role="img" aria-labelledby="title description">
  <title id="title">Unified SessionBackend operation flow</title>
  <desc id="description">From top to bottom, callers use one Session API, which delegates through the one SessionBackend implementation and its gRPC adapter to a ServerConnection. Only there do the two targets diverge: an embedded server in the same process, or a remote server over SSH. Both run the same shared fs implementation, which accesses the filesystem on the host where it executes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --local-surface: #e4f6ec;
        --local-border: #27875b;
        --remote-surface: #e5efff;
        --remote-border: #3478c8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --local-surface: #173d30;
          --local-border: #5bc792;
          --remote-surface: #193a62;
          --remote-border: #72aef2;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 14px; }
      .label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .backend { fill: var(--surface-strong); stroke: var(--border); stroke-width: 2.5; }
      .local-node { fill: var(--local-surface); stroke: var(--local-border); stroke-width: 2; }
      .remote-node { fill: var(--remote-surface); stroke: var(--remote-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .local-edge { stroke: var(--local-border); }
      .remote-edge { stroke: var(--remote-border); }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <path class="edge" d="M 450 110 V 145"/>
  <rect class="node" x="330" y="30" width="240" height="80" rx="12"/>
  <text x="450" y="63">Rust / CLI / TUI</text>
  <text class="secondary" x="450" y="88">caller</text>

  <rect class="node" x="330" y="145" width="240" height="90" rx="12"/>
  <text x="450" y="183">Session</text>
  <text class="secondary" x="450" y="209">one public API</text>
  <path class="edge" d="M 450 235 V 270"/>

  <rect class="backend" x="310" y="270" width="280" height="110" rx="12"/>
  <text x="450" y="308">SessionBackend</text>
  <text class="secondary" x="450" y="332">selected-host capabilities</text>
  <text class="secondary" x="450" y="356">dynamic dispatch</text>
  <path class="edge" d="M 450 380 V 415"/>

  <rect class="backend" x="310" y="415" width="280" height="90" rx="12"/>
  <text x="450" y="453">RpcBackend</text>
  <text class="secondary" x="450" y="479">the only implementation</text>
  <path class="edge" d="M 450 505 V 540"/>

  <rect class="backend" x="310" y="540" width="280" height="110" rx="12"/>
  <text x="450" y="578">ServerConnection</text>
  <text class="secondary" x="450" y="602">one authenticated channel</text>
  <text class="secondary" x="450" y="626">bearer token + health check</text>

  <path class="edge local-edge" d="M 400 650 V 680 C 400 705 225 695 225 735"/>
  <path class="edge remote-edge" d="M 500 650 V 680 C 500 705 675 695 675 735"/>
  <text class="label" x="225" y="710">LOCAL TARGET</text>
  <text class="label" x="675" y="710">REMOTE TARGET</text>

  <rect class="local-node" x="100" y="735" width="250" height="90" rx="12"/>
  <text x="225" y="773">Embedded server</text>
  <text class="secondary" x="225" y="799">loopback port, same process</text>
  <path class="edge local-edge" d="M 225 825 V 855 C 225 880 400 870 400 890"/>

  <rect class="remote-node" x="550" y="735" width="250" height="90" rx="12"/>
  <text x="675" y="773">Remote server</text>
  <text class="secondary" x="675" y="799">loopback port, SSH SOCKS5</text>
  <path class="edge remote-edge" d="M 675 825 V 855 C 675 880 500 870 500 890"/>

  <rect class="backend" x="310" y="890" width="280" height="100" rx="12"/>
  <text x="450" y="929">crate::fs</text>
  <text class="secondary" x="450" y="956">shared filesystem implementation</text>

  <path class="edge local-edge" d="M 400 990 V 1020 C 400 1045 225 1035 225 1075"/>
  <path class="edge remote-edge" d="M 500 990 V 1020 C 500 1045 675 1035 675 1075"/>

  <rect class="local-node" x="100" y="1075" width="250" height="100" rx="12"/>
  <text x="225" y="1114">Client-host filesystem</text>
  <text class="secondary" x="225" y="1141">native filesystem API</text>

  <rect class="remote-node" x="550" y="1075" width="250" height="100" rx="12"/>
  <text x="675" y="1114">Remote-host filesystem</text>
  <text class="secondary" x="675" y="1141">native filesystem API</text>

  <text x="450" y="1210">One client path, one protocol, one core</text>
  <text class="secondary" x="450" y="1235">Only the server's location changes</text>
</svg>
