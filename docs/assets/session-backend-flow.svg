<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1140" viewBox="0 0 900 1140" role="img" aria-labelledby="title description">
  <title id="title">Unified Session operation flow</title>
  <desc id="description">From top to bottom, callers use one Session API, which issues each operation over one ServerConnection. Only there do the two targets diverge: an embedded server in the same process, or a remote server over SSH. Both run the same shared fs implementation, which accesses the filesystem on the host where it executes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      :root {
        --text: #172033;
        --muted-text: #526078;
        --surface: #f7f9fc;
        --surface-strong: #e9eef8;
        --border: #8491a8;
        --local-surface: #e4f6ec;
        --local-border: #27875b;
        --remote-surface: #e5efff;
        --remote-border: #3478c8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #eef3fb;
          --muted-text: #b5c0d3;
          --surface: #202938;
          --surface-strong: #2b3850;
          --border: #8390a6;
          --local-surface: #173d30;
          --local-border: #5bc792;
          --remote-surface: #193a62;
          --remote-border: #72aef2;
        }
      }
      text { fill: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
      .secondary { fill: var(--muted-text); font-size: 14px; }
      .label { fill: var(--muted-text); font-size: 13px; font-weight: 600; letter-spacing: .08em; }
      .node { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
      .backend { fill: var(--surface-strong); stroke: var(--border); stroke-width: 2.5; }
      .local-node { fill: var(--local-surface); stroke: var(--local-border); stroke-width: 2; }
      .remote-node { fill: var(--remote-surface); stroke: var(--remote-border); stroke-width: 2; }
      .edge { fill: none; stroke: var(--border); stroke-width: 2.5; marker-end: url(#arrow); }
      .local-edge { stroke: var(--local-border); }
      .remote-edge { stroke: var(--remote-border); }
      .arrow-head { fill: var(--border); }
    </style>
  </defs>

  <path class="edge" d="M 450 110 V 145"/>
  <rect class="node" x="330" y="30" width="240" height="80" rx="12"/>
  <text x="450" y="63">Rust / CLI / TUI</text>
  <text class="secondary" x="450" y="88">caller</text>

  <rect class="node" x="330" y="145" width="240" height="90" rx="12"/>
  <text x="450" y="183">Session</text>
  <text class="secondary" x="450" y="209">one public API</text>
  <path class="edge" d="M 450 235 V 270"/>

  <rect class="backend" x="310" y="270" width="280" height="110" rx="12"/>
  <text x="450" y="308">session::rpc</text>
  <text class="secondary" x="450" y="332">one request per operation</text>
  <text class="secondary" x="450" y="356">response validation</text>
  <path class="edge" d="M 450 380 V 415"/>

  <rect class="backend" x="310" y="415" width="280" height="120" rx="12"/>
  <text x="450" y="453">ServerConnection</text>
  <text class="secondary" x="450" y="477">owns the server and the channel</text>
  <text class="secondary" x="450" y="501">authenticated channel + health check</text>

  <path class="edge local-edge" d="M 400 535 V 565 C 400 590 225 580 225 620"/>
  <path class="edge remote-edge" d="M 500 535 V 565 C 500 590 675 580 675 620"/>
  <text class="label" x="225" y="595">LOCAL TARGET</text>
  <text class="label" x="675" y="595">REMOTE TARGET</text>

  <rect class="local-node" x="100" y="620" width="250" height="90" rx="12"/>
  <text x="225" y="658">Embedded server</text>
  <text class="secondary" x="225" y="684">loopback port, same process</text>
  <path class="edge local-edge" d="M 225 710 V 740 C 225 765 400 755 400 775"/>

  <rect class="remote-node" x="550" y="620" width="250" height="90" rx="12"/>
  <text x="675" y="658">Remote server</text>
  <text class="secondary" x="675" y="684">loopback port, SSH SOCKS5</text>
  <path class="edge remote-edge" d="M 675 710 V 740 C 675 765 500 755 500 775"/>

  <rect class="backend" x="310" y="775" width="280" height="100" rx="12"/>
  <text x="450" y="814">crate::fs</text>
  <text class="secondary" x="450" y="841">shared filesystem implementation</text>

  <path class="edge local-edge" d="M 400 875 V 905 C 400 930 225 920 225 960"/>
  <path class="edge remote-edge" d="M 500 875 V 905 C 500 930 675 920 675 960"/>

  <rect class="local-node" x="100" y="960" width="250" height="100" rx="12"/>
  <text x="225" y="999">Client-host filesystem</text>
  <text class="secondary" x="225" y="1026">native filesystem API</text>

  <rect class="remote-node" x="550" y="960" width="250" height="100" rx="12"/>
  <text x="675" y="999">Remote-host filesystem</text>
  <text class="secondary" x="675" y="1026">native filesystem API</text>

  <text x="450" y="1095">One client path, one protocol, one core</text>
  <text class="secondary" x="450" y="1120">Only the server's location changes</text>
</svg>
