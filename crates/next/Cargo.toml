[package]
# A working name. It becomes `file-peeker` at cutover, when the root package goes.
name = "file-peeker-next"
version = "0.0.0"
edition = "2024"
# `File::try_lock` is what holds the single-instance lock.
rust-version = "1.89"
license = "Apache-2.0"
publish = false
autobins = false

[dependencies]
clap = { version = "4.6.2", features = ["derive"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
prost = "0.14.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.52.4", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "fpk"
path = "src/bin/fpk.rs"

[lints]
workspace = true
