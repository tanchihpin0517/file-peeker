syntax = "proto3";

package file_peeker.v1;

service FilePeeker {
  rpc ResolvePath(ResolvePathRequest) returns (ResolvePathResponse);
  rpc List(ListRequest) returns (stream ListBatch);
  rpc Walk(WalkRequest) returns (stream WalkBatch);
  rpc Read(ReadRequest) returns (stream ReadChunk);
  rpc Write(stream WriteFrame) returns (WriteResponse);
}

message ResolvePathRequest {
  string path = 1;
}

message ResolvePathResponse {
  string path = 1;
}

message ListRequest {
  string path = 1;
}

message WalkRequest {
  string path = 1;
}

message ReadRequest {
  string path = 1;
}

message ReadChunk {
  bytes data = 1;
}

message WriteFrame {
  oneof payload {
    WriteHeader header = 1;
    bytes data = 2;
    WriteCommit commit = 3;
  }
}

message WriteHeader {
  string directory = 1;
  string name = 2;
  WriteConflict conflict = 3;
}

message WriteCommit {}

enum WriteConflict {
  WRITE_CONFLICT_UNSPECIFIED = 0;
  WRITE_CONFLICT_FAIL_IF_EXISTS = 1;
  WRITE_CONFLICT_REPLACE = 2;
}

message WriteResponse {
  string path = 1;
  uint64 bytes_written = 2;
}

message ListBatch {
  repeated ListingEntry entries = 1;
}

message WalkBatch {
  repeated WalkEntry entries = 1;
}

message WalkEntry {
  string relative_path = 1;
  ListingEntry entry = 2;
  uint64 depth = 3;
}

message ListingEntry {
  string name = 1;
  EntryKind kind = 2;
  bool navigable = 3;
  // Why this one entry is degraded, for a front end to show on the selected row.
  // Empty when it is not. Never ends the listing: it describes the entry it arrived
  // with, and the entries behind it still follow.
  string defect = 4;
  // Absent when the entry could not be inspected. Explicit presence so absent is
  // distinct from zero: an empty file and an unreadable one must not look alike.
  optional EntryMetadata metadata = 5;
}

message EntryMetadata {
  uint64 size = 1;
  // Signed, because a modification time before 1970 is a real thing to find on a
  // filesystem.
  int64 modified_unix_seconds = 2;
  uint32 modified_nanos = 3;
  // Absent off Unix, where there is no mode to report.
  optional uint32 unix_mode = 4;
  // The link's own target, escaped like every other name. Empty unless the kind is
  // ENTRY_KIND_SYMLINK.
  string symlink_target = 5;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIRECTORY = 2;
  ENTRY_KIND_SYMLINK = 3;
  ENTRY_KIND_OTHER = 4;
}
